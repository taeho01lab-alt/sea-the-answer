[project]
name = "haedap-service"
version = "2.0.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "httpx>=0.28,<1", "pypdf>=6,<7",
  "python-multipart>=0.0.20,<1", "python-dotenv>=1,<2",
  "chromadb>=1,<2", "rank-bm25>=0.2.2,<1"
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["service/tests"]
